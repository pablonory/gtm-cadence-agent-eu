<title>Cadence Brief — HubSpot custom object (US-reps-only)</title>
<style>

  .rhead .obj-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--hs-muted);font-weight:700}
  .rhead h2{margin:3px 0 0;font-size:17px;font-weight:500}

  .scorebox{display:flex;align-items:center;gap:14px;padding:2px 0 14px;border-bottom:1px solid var(--hs-border);margin-bottom:14px}

  .flowmini{display:flex;gap:3px;margin-top:10px;flex-wrap:wrap}

  .flowmini i.cst{background:#fff2c9;border-color:var(--hs-yellow);color:#8a6d1a}
  .flowmini i.em{color:var(--hs-purple)} .flowmini i.cl{color:#b0454a} .flowmini i.li{color:#0a66c2}

  .chatwrap{margin-top:6px;border:1px solid var(--hs-border);border-radius:5px;background:#fbfcfd}
  .chatlog{max-height:150px;overflow-y:auto;padding:10px 11px;display:flex;flex-direction:column;gap:8px}
  .cmsg{font-size:12.5px;line-height:1.45} .cmsg.u{text-align:right}
  .cmsg .who{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--hs-muted);font-weight:700;margin-bottom:2px}
  .cmsg.a .bub{background:#fff;border:1px solid var(--hs-border);border-radius:4px;padding:8px 10px;display:inline-block;max-width:100%}
  .cmsg.u .bub{background:#e7f4f7;border:1px solid #bfe3ea;border-radius:4px;padding:6px 10px;display:inline-block}
  .cmsg .kv{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:1px 0}
  .chat-in{display:flex;gap:6px;padding:8px;border-top:1px solid var(--hs-border)}
  .chat-in input{flex:1;border:1px solid var(--hs-border-2);border-radius:4px;padding:7px 9px;font-family:inherit;font-size:12.5px}
  .chat-in input:focus{outline:none;border-color:var(--hs-teal)}

  .sug{font-size:11.5px;padding:5px 9px;border:1px solid var(--hs-border-2);background:#fff;border-radius:14px;color:var(--hs-link)}

  .assoc .nm{font-size:12.5px;color:var(--hs-link);font-weight:500} .assoc .rl{font-size:11.5px;color:var(--hs-muted)}

  .callout{background:var(--hs-green-bg);border:1px solid #b7ebe3;border-radius:5px;padding:9px 11px;font-size:11.5px;color:#0a7d6e;display:flex;gap:8px;align-items:flex-start}

  /* ---------- ACCESS VIEW ---------- */
  .access{padding-bottom:50px}
  .access .settings-crumb{color:var(--hs-ink-2);font-size:12.5px;margin-bottom:14px}
  .access h1{font-size:20px;font-weight:500;margin:0 0 4px}
  .access .lede{color:var(--hs-ink-2);font-size:13px;margin:0 0 20px;max-width:680px}
  .layers{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
  .layer{border:1px solid var(--hs-border);border-radius:8px;background:var(--hs-surface);overflow:hidden}
  .layer .lh{padding:14px 16px;border-bottom:1px solid var(--hs-border);display:flex;align-items:center;gap:11px}
  .layer .lnum{width:30px;height:30px;border-radius:7px;background:var(--hs-ink);color:#c6f24e;display:grid;place-items:center;font-weight:700;font-family:var(--hs-mono)}

  .blocked h4{margin:0 0 8px;font-size:12.5px;color:#c0343b;display:flex;align-items:center;gap:7px}
  .netcard{border:1px solid var(--hs-border);border-radius:8px;background:var(--hs-surface);padding:16px;margin-top:4px}

  .flowline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px}
  .flowline .stepbox{border:1px solid var(--hs-border-2);border-radius:6px;padding:8px 11px;background:#fafbfc;text-align:center;min-width:120px}
  .flowline .stepbox b{display:block;font-size:12px;color:var(--hs-ink)} .flowline .stepbox span{font-size:10.5px;color:var(--hs-muted)}
  .flowline .arr{color:var(--hs-muted)}
  .note{font-size:11.5px;color:var(--hs-muted);margin-top:10px;line-height:1.5}

  .protolabel{position:fixed;bottom:12px;left:12px;background:var(--hs-nav);color:#c8d2de;font-size:11px;padding:6px 11px;border-radius:5px;z-index:50;font-family:var(--hs-mono);opacity:.92}
  .protolabel b{color:var(--hs-orange)}
  #toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--hs-ink);color:#fff;padding:10px 16px;border-radius:5px;font-size:12.5px;box-shadow:0 6px 24px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:.24s;z-index:100}

  @media (max-width:1080px){.rec{grid-template-columns:1fr}.layers{grid-template-columns:1fr}.hs-search{display:none}}

</style>

<script>

function wireCard(a){
  if(a.status==='queued') return;

/* ---------------- card interactions ---------------- */
function wc(){const b=$('#body'); if(!b) return; $('#wc').textContent=b.textContent.trim().split(/\s+/).length+' words';}
function soften(id){const a=A(id); if(!a.alt) return; ui[id].soft=true; $('#subj').innerHTML='<span>Subject</span><b>'+esc(a.alt.subject)+'</b>'; $('#body').textContent=a.alt.body; wc(); toast('Softened — opens on a question, no hard ask'); pushA('Done — softened the ask and dropped the pitch-y line. The email above updated.');}
function copyEmail(id){const a=A(id); const e=ui[id].soft&&a.alt?a.alt:a.email; navigator.clipboard?.writeText('Subject: '+e.subject+'\n\n'+e.body).catch(()=>{}); toast('Email copied — paste into the Gong Email 1 slot');}
function fb(el,dir){const on=el.getAttribute('aria-pressed')==='true'; document.querySelectorAll('.thumb').forEach(t=>t.setAttribute('aria-pressed','false')); el.setAttribute('aria-pressed',!on); toast(!on?(dir==='up'?'Logged as a good draft':'Noted — agent will ask what to change'):'Cleared');}
function pushU(t){const l=$('#chatlog');l.insertAdjacentHTML('beforeend',`<div class="cmsg u"><div class="bub">${esc(t)}</div></div>`);l.scrollTop=l.scrollHeight;}
function pushA(h){const l=$('#chatlog');l.insertAdjacentHTML('beforeend',`<div class="cmsg a"><div class="who">Cadence Agent</div><div class="bub">${h}</div></div>`);l.scrollTop=l.scrollHeight;}
function ask(id,t){const a=A(id);pushU(t);const q=t.toLowerCase();setTimeout(()=>{
  if(/score|why.*\d|\d/.test(q)&&/score|\d/.test(q)){const bd=a.breakdown.map(b=>`<div class="kv"><span>${b[0]}</span><b>${typeof b[1]==='number'?'+'+b[1]:b[1]}</b></div>`).join('');pushA(`<b>${a.company} · ${a.score}/100</b>${bd}${a.score>=75?'Strong, recent, multi-signal — launch this week.':a.score>=60?'Solid — worth running now.':'Thin — I led on the vertical default rather than manufacture personalisation.'}`);}
  else if(/soft|redraft|gentl/.test(q)){soften(id);}
  else if(/linkedin|connect/.test(q))pushA(`<b>Connect note:</b> Hi ${a.contact.split(' ')[0]==='—'?'there':a.contact.split(' ')[0]} — reaching out to ${a.vertical} ${a.persona.toLowerCase()} leads about live per-site margin. Given ${a.signals[0]?a.signals[0].title.toLowerCase():'the recent moves'}, thought it might be relevant. Open to connecting?<br><span style="color:var(--hs-muted);font-size:11.5px">Templated in the cell — copy from Gong when you assemble.</span>`);
  else pushA('I can explain the score, redraft the first touch, or draft the LinkedIn / call opener. What would help?');
},420);}
function sendChat(id){const v=$('#cin').value.trim(); if(v){ask(id,v); $('#cin').value='';}}
window.soften=soften;window.copyEmail=copyEmail;window.fb=fb;window.ask=ask;window.sendChat=sendChat;

        <div class="lh"><div class="lnum">2</div><div><h3>Record scope — your own briefs</h3><p>Team: “US Sales — AE”</p></div></div>
        <div class="lb">
          <div class="perm-row"><span class="pl">Reps see</span><span class="pv"><span class="scope-pill">Briefs they own</span></span></div>
          <div class="perm-row"><span class="pl">Manager (Lewis)</span><span class="pv"><span class="scope-pill" style="background:#e3f2fb;color:#1d7aad">Whole team</span></span></div>
          <div class="perm-row"><span class="pl">Manager · Edit / launch</span><span class="pv"><span class="no">✕ View only</span></span></div>
          <div class="perm-row"><span class="pl">Owner set by</span><span class="pv">Agent, from the input sheet’s Rep column</span></div>
          <div class="blocked" style="margin-top:12px">
            <h4><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>Cannot see the object at all</h4>
            <div class="members">${outsiders.map(o=>`<span class="member ghost">${o}</span>`).join('')}</div>
          </div>
        </div>
      </div>
    </div>

    <div class="netcard">
      <h3>Net effect — what a request actually returns</h3>
      <div class="flowline">
        <div class="stepbox"><b>Rep signs in</b><span>Google SSO → HubSpot user</span></div>
        <span class="arr">→</span>
        <div class="stepbox"><b>Layer 1</b><span>In “US Cadence — AE” set?</span></div>
        <span class="arr">→</span>
        <div class="stepbox"><b>Layer 2</b><span>owner = this user?</span></div>
        <span class="arr">→</span>
        <div class="stepbox" style="background:var(--hs-green-bg);border-color:#b7ebe3"><b>Returns</b><span>only their briefs</span></div>
      </div>
      <div class="note">A UK rep or a marketer fails Layer 1 — the object, the list view, and the card don't exist for them. A US rep passes Layer 1 but Layer 2 filters the query to <code style="font-family:var(--hs-mono)">owner = them</code>, so they never receive another rep's rows even by editing the URL or the API call. Lewis gets a team-wide read for coaching, but can't launch on a rep's behalf.</div>
    </div>

    <div style="margin-top:16px"><button class="btn" onclick="go('list')">← Back to Cadence Briefs</button></div>
  </div>`;
}

/* ---------------- toast + init ---------------- */
let tt;function toast(m){const el=$('#toast');el.textContent=m;el.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),2400);}
window.toast=toast;
renderList();
</script>
